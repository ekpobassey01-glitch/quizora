<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZORA - JAMB WAEC NECO CBT</title><style>body{font-family:Arial;background:#F1F5F9;margin:0;padding:10px}.top{background:linear-gradient(90deg,#2563EB,#7C3AED);color:#fff;padding:15px;border-radius:12px;text-align:center}.card{background:#fff;border-radius:12px;padding:15px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;margin-top:8px;font-size:16px}.btn-blue{background:#2563EB;color:#fff}.btn-green{background:#16A34A;color:#fff}.btn-red{background:#DC2626;color:#fff}.btn-yellow{background:#F59E0B}.btn-purple{background:#7C3AED;color:#fff}.btn-ghost{background:#E2E8F0}.inp{width:100%;padding:12px;border:1px solid #CBD5E1;border-radius:10px;margin-top:8px;box-sizing:border-box}.opt{border:1px solid #CBD5E1;border-radius:10px;padding:12px;margin-top:8px}.sel{background:#DBEAFE;border-color:#2563EB}.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}.cell{padding:8px;text-align:center;background:#E2E8F0;border-radius:8px;font-size:12px}.cell.on{background:#BBF7D0}.cell.view{outline:3px solid #2563EB}.hidden{display:none}</style></head><body>
<div class="top"><h1>QUIZORA</h1><p>JAMB | WAEC | NECO - Live CBT</p><p id="liveCount">Loading...</p></div>
<div id="homePage"><div class="card"><h2>Welcome to QUIZORA</h2><p>Tap a body to start - Admin login is private</p><button class="btn btn-blue" onclick="showPage('student')">Start as Student</button><button class="btn btn-ghost" onclick="showPage('login')">Admin Login</button></div></div>
<div id="studentPage" class="hidden"><div class="card"><h2>Student CBT</h2><select id="sBody" class="inp"><option>JAMB</option><option>WAEC</option><option>NECO</option></select><select id="sSub" class="inp"><option>Mathematics</option><option>English Language</option><option>CRS</option><option>Biology</option><option>Chemistry</option><option>Physics</option></select><button class="btn btn-green" onclick="startExam()">Start Exam</button><button class="btn btn-ghost" onclick="showPage('home')">Back Home</button></div><div class="card" id="examArea">Select subject and Start</div></div>
<div id="loginPage" class="hidden"><div class="card"><h2>Admin Login</h2>
<div id="createBox" class="hidden" style="background:#FEF3C7;padding:12px;border-radius:10px"><b>First Time? Create Your Admin Password Here</b><p>This is your private password. Students cannot see it.</p><input id="newAdminPass" class="inp" type="password" placeholder="Create your password"><input id="newAdminPass2" class="inp" type="password" placeholder="Type it again to confirm"><button class="btn btn-green" onclick="createAdminPass()">Create My Password</button></div>
<div id="normalLoginBox"><p>Enter your Admin Password</p><input id="adminPass" class="inp" type="password" placeholder="Your password"><button class="btn btn-blue" onclick="adminLogin()">Login as Admin</button><button class="btn btn-ghost" onclick="showPage('home')">Back Home</button></div>
</div></div>
