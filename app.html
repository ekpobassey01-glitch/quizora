<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZORA - 200 Questions</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f4f8;margin:0;padding:16px}
  .box{background:#fff;max-width:900px;margin:auto;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  h1{margin:0} h1 span{color:#6a00ff}
  textarea{width:100%;height:180px;padding:12px;font-size:15px;border:2px solid #6a00ff;border-radius:8px;box-sizing:border-box}
  button{padding:12px 18px;border:0;border-radius:8px;font-size:16px;cursor:pointer;margin:6px 6px 6px 0}
  .purple{background:#6a00ff;color:#fff} .green{background:#0a9d4d;color:#fff} .red{background:#e11d48;color:#fff} .grey{background:#e5e7eb}
  select,input{padding:10px;font-size:16px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin:6px 0}
  .q{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
  .q b{font-size:17px}
  .correct{color:green;font-weight:bold}
  small{color:#666}
</style>
</head>
<body>
<div class="box">
  <h1>QUIZORA <span>200</span></h1>
  <p>Batch size: <b>200 questions</b> | Total loaded: <b id="count">0</b></p>

  <label>Subject</label>
  <select id="subject">
    <option>Mathematics</option>
    <option>English</option>
    <option>Science</option>
    <option>General Knowledge</option>
  </select>

  <h3>Paste Batch Here - 200 Questions</h3>
  <p><small>Format per line: Question | Option A | Option B | Option C | Option D | Correct Letter | Explanation</small></p>
  <textarea id="pasteBox" placeholder="Paste your 200 questions here, one question per line..."></textarea>
  <br>
  <button class="purple" onclick="importPasted()">Import Pasted Questions (Up to 200)</button>
  <button class="purple" onclick="reshuffleAll()">Reshuffle All Correct Options</button>
  <button class="green" onclick="load200()">Load 200 Mathematics Questions Now - Reshuffled</button>
  <button class="red" onclick="clearAll()">Delete All</button>
  <button class="grey" onclick="exportCSV()">Export CSV</button>

  <h3>Questions List</h3>
  <div id="list"><p>No questions yet. Paste and Import, or tap Load 200.</p></div>
</div>

<script>
let questions = JSON.parse(localStorage.getItem('quizora200') || '[]');

function save(){ localStorage.setItem('quizora200', JSON.stringify(questions)); render(); }

// Shuffle an array - Fisher-Yates, no pattern
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function importPasted(){
  const text = document.getElementById('pasteBox').value.trim();
  if(!text){ alert('Paste box is empty. Paste your 200 questions first.'); return; }
  const lines = text.split('\n').filter(l=>l.trim().length>0);
  if(lines.length > 200){ alert('You pasted '+lines.length+'. Only first 200 will be used.'); }
  const subject = document.getElementById('subject').value;
  let added = 0;
  for(let line of lines.slice(0,200)){
    const p = line.split('|');
    if(p.length < 6) continue;
    questions.push({
      subject: subject,
      question: p[0].trim(),
      a: (p[1]||'').trim(),
      b: (p[2]||'').trim(),
      c: (p[3]||'').trim(),
      d: (p[4]||'').trim(),
      correct: (p[5]||'').trim().toUpperCase(),
      explanation: (p[6]||'').trim()
    });
    added++;
  }
  document.getElementById('pasteBox').value='';
  // Automatically reshuffle after import so there is no sequence
  reshuffleAll(false);
  save();
  alert(added + ' Questions Imported and Reshuffled Successfully');
}

// Reshuffle correct options for all questions - no AAAA, no BBBB, no ABCD pattern
function reshuffleAll(showAlert=true){
  const letters = ['A','B','C','D'];
  questions.forEach(q=>{
    // Get correct text
    const correctText = q[q.correct.toLowerCase()];
    // Put all options in array and shuffle
    let opts = shuffleArray([q.a, q.b, q.c, q.d]);
    // Find where correct text ended up after shuffle
    const newIndex = opts.indexOf(correctText);
    q.a = opts[0]; q.b = opts[1]; q.c = opts[2]; q.d = opts[3];
    q.correct = letters[newIndex];
  });
  save();
  if(showAlert) alert('All Correct Options Reshuffled Successfully');
}

function load200(){
  const subject = document.getElementById('subject').value;
  if(!confirm('This will add 200 Mathematics questions with reshuffled answers. Continue?')) return;
  const letters = ['A','B','C','D'];
  for(let i=1;i<=200;i++){
    const a = 2 + i;
    const b = 3 + (i % 11);
    const ans = a + b;
    // Create options, then shuffle them so correct is random
    let opts = shuffleArray([String(ans-2), String(ans), String(ans+1), String(ans+3)]);
    const correctIndex = opts.indexOf(String(ans));
    questions.push({
      subject: subject,
      question: `What is ${a} + ${b}?`,
      a: opts[0], b: opts[1], c: opts[2], d: opts[3],
      correct: letters[correctIndex],
      explanation: `${a} + ${b} = ${ans}`
    });
  }
  save();
  alert('200 Questions Loaded With Reshuffled Answers');
}

function deleteOne(i){ if(confirm('Delete this question?')){ questions.splice(i,1); save(); } }
function clearAll(){ if(confirm('Delete ALL questions?')){ questions=[]; save(); } }

function exportCSV(){
  if(!questions.length){ alert('No questions to export'); return; }
  let csv = 'Question,Option A,Option B,Option C,Option D,Correct,Explanation,Subject\n';
  questions.forEach(q=>{
    csv += `"${q.question}","${q.a}","${q.b}","${q.c}","${q.d}","${q.correct}","${q.explanation}","${q.subject}"\n`;
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'quizora_200.csv';
  a.click();
}

function render(){
  document.getElementById('count').innerText = questions.length;
  const list = document.getElementById('list');
  if(!questions.length){ list.innerHTML='<p>No questions yet. Paste and Import, or tap Load 200.</p>'; return; }
  list.innerHTML = questions.map((q,i)=>`
    <div class="q">
      <b>Q${i+1}: ${q.question}</b> <small>(${q.subject})</small><br>
      A. ${q.a}<br>B. ${q.b}<br>C. ${q.c}<br>D. ${q.d}<br>
      <span class="correct">Correct: ${q.correct}</span> ${q.explanation? ' - '+q.explanation:''}<br>
      <button class="red" onclick="deleteOne(${i})">Delete</button>
    </div>`).join('');
}
render();
</script>
</body>
</html>
